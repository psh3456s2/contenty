<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 — Contenty</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/">✦ Contenty</a>
      <div class="nav-right" id="navRight"></div>
    </div>
  </nav>

  <div id="authModal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="authContent"></div>
    </div>
  </div>

  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1>내 대시보드</h1>
    </div>

    <!-- 프로필 카드 -->
    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profileAvatar">👤</div>
        <label class="avatar-edit-btn" for="avatarInput">📷</label>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" />
      </div>
      <div class="profile-info">
        <div class="profile-nickname-row">
          <span class="profile-nickname" id="profileNickname">닉네임 없음</span>
          <button class="profile-edit-btn" id="editNicknameBtn">✏️ 수정</button>
        </div>
        <span class="profile-email" id="profileEmail"></span>
        <span class="profile-plan" id="profilePlanBadge"></span>
      </div>
    </div>

    <!-- 닉네임 수정 폼 (숨김) -->
    <div class="nickname-form hidden" id="nicknameForm">
      <input type="text" id="nicknameInput" class="auth-input" placeholder="닉네임 입력 (최대 20자)" maxlength="20" />
      <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
        <button class="btn-primary" id="saveNicknameBtn">저장</button>
        <button class="btn-secondary" id="cancelNicknameBtn">취소</button>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="dash-cards">
      <div class="dash-card">
        <div class="dash-card-label">현재 플랜</div>
        <div class="dash-card-value" id="dashPlan">—</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">오늘 생성 횟수</div>
        <div class="dash-card-value" id="dashUsage">—</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">오늘 남은 횟수</div>
        <div class="dash-card-value" id="dashRemaining">—</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">가입일</div>
        <div class="dash-card-value" id="dashJoined">—</div>
      </div>
    </div>

    <div class="dash-actions">
      <a href="/" class="btn-primary">콘텐츠 생성하러 가기</a>
      <button id="manageSubBtn" class="btn-secondary" style="display:none">구독 관리 (취소/변경)</button>
      <a href="/pages/pricing.html" class="btn-outline" id="upgradePlanBtn">플랜 업그레이드</a>
    </div>

    <div class="dash-section">
      <h2>생성 히스토리</h2>
      <p class="dash-hint">최근 생성한 콘텐츠 기록입니다.</p>
      <div id="historyList" class="history-list">
        <p class="empty-msg">아직 생성 기록이 없어요.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-bottom">
        <p>© 2026 Contenty · <a href="/">홈으로</a></p>
      </div>
    </div>
  </footer>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
