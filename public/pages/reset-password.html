<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 — Contenty</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/">✦ Contenty</a>
    </div>
  </nav>

  <main>
    <div style="max-width:420px;margin:4rem auto;padding:2rem 1.5rem;">
      <h2 class="auth-title">새 비밀번호 설정 🔒</h2>
      <p class="auth-sub">새로 사용할 비밀번호를 입력해주세요.</p>
      <div id="resetMsg"></div>
      <div class="auth-form">
        <input class="auth-input" type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" />
        <input class="auth-input" type="password" id="newPasswordConfirm" placeholder="새 비밀번호 확인" autocomplete="new-password" />
        <button class="btn-auth-primary" id="resetSubmitBtn">비밀번호 변경</button>
      </div>
    </div>
  </main>

  <script src="/js/supabase-client.js"></script>
  <script>
    let canReset = false;

    // 메일 링크로 들어오면 Supabase가 자동으로 복구 세션을 만들어줌
    _supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || session) {
        canReset = true;
      }
    });

    function setMsg(msg, type = 'error') {
      const el = document.getElementById('resetMsg');
      el.innerHTML = `<div class="auth-${type}">${msg}</div>`;
    }

    document.getElementById('resetSubmitBtn').addEventListener('click', async () => {
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('newPasswordConfirm').value;

      if (!pw || pw.length < 8) { setMsg('비밀번호는 8자 이상이어야 합니다.'); return; }
      if (pw !== confirm) { setMsg('비밀번호가 일치하지 않습니다.'); return; }

      const btn = document.getElementById('resetSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>변경 중...';

      const { error } = await _supabase.auth.updateUser({ password: pw });

      btn.disabled = false;
      btn.textContent = '비밀번호 변경';

      if (error) {
        setMsg('변경에 실패했어요: ' + error.message + ' (링크가 만료되었다면 다시 요청해주세요.)');
      } else {
        setMsg('비밀번호가 변경되었어요! 잠시 후 홈으로 이동합니다. 🎉', 'success');
        setTimeout(() => { window.location.href = '/'; }, 2000);
      }
    });
  </script>
</body>
</html>
